spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
  config:
    activate:
      on-profile: test

  data:
    redis:
      host: localhost
      port: 6379

  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: 
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        show_sql: true
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
    open-in-view: false

  servlet:
    multipart:
      enabled: true
      file-size-threshold: 0B
      location: /tmp
      max-file-size: 100MB
      max-request-size: 100MB

jwt:
  secret: test_secret_key_for_jwt_token_generation_must_be_long_enough_1234567890

token:
  expire:
    time:
      access: 180000000
      refresh: 180000000

google:
  client:
    id: test-google-client-id
    secret: test-google-client-secret
  redirect:
    uri: http://localhost:8080/api/oauth2/callback/google

oauth:
  kakao:
    rest-api-key: test-kakao-rest-api-key
    redirect-url: http://localhost:8080/api/oauth2/callback/kakao

aws:
  s3:
    accessKey: test-access-key
    secretKey: test-secret-key

sse:
  timeout: 259200000

kafka:
  topic-name: sse_notifications
  group-id: sse-group
  bootstrap-servers: localhost:9092

logging:
  level:
    root: ERROR
    org.hibernate.SQL: ERROR
    org.hibernate.type.descriptor.sql.BasicBinder: ERROR
